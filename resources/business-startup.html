<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>正在启动数据融合助手</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1d1d1f;background:#f5f5f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}
    main{width:100%;max-width:410px;text-align:center} .mark{width:58px;height:58px;margin:0 auto 23px;display:grid;place-items:center;border-radius:15px;background:#007aff;color:white;font-size:28px;font-weight:600}
    h1{font-size:23px;line-height:1.3;letter-spacing:-.5px;margin:0 0 21px;font-weight:600}h2{font-size:15px;font-weight:500;line-height:1.7;margin:0 0 8px}
    p{font-size:13px;line-height:1.7;color:#6e6e73;margin:0;overflow-wrap:anywhere}.detail{min-height:44px} .version{margin-top:20px;font-size:12px;color:#86868b}
    progress{display:block;width:100%;height:5px;margin:22px 0 0;accent-color:#007aff;border:0;border-radius:4px;overflow:hidden}progress::-webkit-progress-bar{background:#e5e5ea}progress::-webkit-progress-value{background:#007aff}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:23px}button{font:inherit;min-width:112px;min-height:44px;border:1px solid #dedee3;border-radius:10px;background:#fff;color:#1d1d1f;cursor:pointer;padding:10px 18px;transition:background .15s}
    button:hover{background:#ededf0}.primary{background:#007aff;color:white;border-color:#007aff}.primary:hover{background:#0068db}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #89bcff;outline-offset:3px}[hidden]{display:none!important}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body><main>
  <div class="mark" aria-hidden="true">融</div><h1>数据融合助手</h1>
  <section id="status" role="status" aria-live="polite" aria-busy="true"><h2 id="message">正在检查可用版本…</h2><p id="detail" class="detail">准备完成后将自动进入应用。</p></section>
  <progress id="progress" max="100" aria-label="启动更新进度"></progress>
  <div class="actions"><button id="quit" hidden>退出应用</button><button id="retry" class="primary" hidden>重试</button></div>
  <p id="version" class="version"></p>
</main></body>
</html>
