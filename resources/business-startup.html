<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>数据融合助手</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1d1d1f;background:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;-webkit-app-region:drag;user-select:none}
    main{width:100%;max-width:296px;text-align:center}.mark{width:44px;height:44px;margin:0 auto 20px;display:block}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}h2{font-size:14px;font-weight:500;line-height:1.6;margin:0}
    p{font-size:12px;line-height:1.7;color:#6e6e73;margin:10px 0 0;overflow-wrap:anywhere}
    progress{display:block;width:180px;height:3px;margin:22px auto 0;accent-color:#007aff;border:0;border-radius:3px;overflow:hidden}progress::-webkit-progress-bar{background:#e9e9ed}progress::-webkit-progress-value{background:#007aff}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:20px}button{font:inherit;font-size:13px;min-width:100px;min-height:44px;border:1px solid #e5e5ea;border-radius:10px;background:#fff;color:#1d1d1f;cursor:pointer;padding:10px 16px;transition:background .15s;-webkit-app-region:no-drag}
    button:hover{background:#f5f5f7}.primary{background:#007aff;color:white;border-color:#007aff}.primary:hover{background:#0068db}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #89bcff;outline-offset:2px}[hidden]{display:none!important}
    .close{position:absolute;top:4px;right:4px;display:grid;place-items:center;min-width:44px;width:44px;height:44px;padding:0;border:0;border-radius:12px;color:#86868b;background:transparent}.close svg{width:14px;height:14px}.blocked .mark{margin-bottom:16px}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body><button id="close" class="close" aria-label="退出应用" title="退出应用"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button><main>
  <svg class="mark" viewBox="0 0 512 512" fill="none" aria-hidden="true"><rect x="16" y="16" width="480" height="480" rx="112" fill="#007AFF"/><path d="M132 204c-14-8-14-28 0-36l106-61c11-6 25-6 36 0l106 61c14 8 14 28 0 36l-106 61c-11 6-25 6-36 0L132 204Z" fill="white"/><path d="m132 268 106 61c11 6 25 6 36 0l106-61m-248 78 106 61c11 6 25 6 36 0l106-61" stroke="white" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>数据融合助手</h1>
  <section id="status" role="status" aria-live="polite" aria-busy="true"><h2 id="message">正在启动…</h2><p id="detail" hidden></p></section>
  <progress id="progress" max="100" aria-label="启动更新进度"></progress>
  <div id="actions" class="actions" hidden><button id="quit" hidden>退出应用</button><button id="retry" class="primary" hidden>重试</button></div>
</main></body>
</html>
