name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Export preservation under restricted script policy
        run: npm run test:export-preservation

      - name: Build
        run: npm run build

      - name: Admin API regression
        run: npm run test:admin

      - name: Install admin frontend dependencies
        run: npm --prefix admin-server/web ci

      - name: Audit admin frontend dependencies
        run: npm --prefix admin-server/web audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build admin frontend
        run: npm run admin:web:build
